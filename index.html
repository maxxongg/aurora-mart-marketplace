<!doctype html>
<html lang="en">
  <head>
    <script>
      (function(){var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme:dark)").matches)){document.documentElement.classList.add("dark")}})();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Mart - Multi-Vendor E-Commerce Platform</title>
    <meta name="description" content="Aurora Mart - Your one-stop marketplace for quality products from trusted sellers. Shop electronics, fashion, beauty, and more." />
    <meta name="author" content="Aurora Mart" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="canonical" href="https://auroramart.com" />

    <meta property="og:title" content="Aurora Mart - Multi-Vendor E-Commerce" />
    <meta property="og:description" content="Shop quality products from trusted sellers. Electronics, fashion, beauty and more." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://auroramart.com" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@AuroraMart" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Aurora Mart",
      "url": "https://auroramart.com",
      "description": "Multi-vendor e-commerce platform for quality products from trusted sellers.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://auroramart.com/products?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
